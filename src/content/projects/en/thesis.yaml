title: "E-Signature Platform for FACET-UNT"
description: "University thesis: an on-premise electronic document signature system for FACET, the science and technology school of Universidad Nacional de Tucumán (UNT). The infrastructure already existed (Nginx edge, Coolify on Proxmox LXC); the work was analyzing it and building the system on top: Documenso with PostgreSQL, the faculty's MinIO as object storage, and Google OAuth restricted to the institutional domain. In the end, I learned how to deploy and maintain a system in production, and everything that implies: logs and metrics for monitoring, backups and retention policies."
