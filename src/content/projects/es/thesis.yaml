title: "Plataforma de Firma Electrónica para FACET-UNT"
description: "Tesis de grado: un sistema de firma electrónica de documentos on-premise para la FACET, la Facultad de Ciencias Exactas y Tecnología de la Universidad Nacional de Tucumán (UNT). La infraestructura ya existía (Nginx de borde, Coolify sobre LXC en Proxmox); el trabajo fue analizarla y montar el sistema encima: Documenso con PostgreSQL, el MinIO de la facultad como almacenamiento de objetos y Google OAuth restringido al dominio institucional. Al final, aprendí cómo se despliega y se mantiene un sistema en producción, y todo lo que eso implica: logs y métricas para el monitoreo, backups y políticas de retención."
